name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # AGP 9 requires JDK 17+. 21 is the LTS this project builds against
      # locally (see .mise.toml).
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Handles dependency/build caching. Wrapper-jar checksum validation is
      # on by default, so it is not passed explicitly.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Android 17 is recent enough that the runner image does not ship it.
      #
      # The platform MUST be requested as "platforms;android-37.0" — API 37 uses
      # the minor-version naming scheme, and a plain "platforms;android-37" does
      # not exist and will fail to resolve. compileSdk = 37 still maps to it.
      #
      # This step also puts the SDK on ANDROID_HOME/ANDROID_SDK_ROOT, which is
      # how Gradle locates it here: local.properties is deliberately gitignored,
      # so there is no sdk.dir on CI.
      - name: Install Android SDK for API 37
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0'

      - name: Assemble and lint
        run: ./gradlew assembleDebug assembleRelease lintDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Runs even when the build fails, since that is exactly when the lint
      # report is worth reading.
      - name: Upload lint report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: warn
