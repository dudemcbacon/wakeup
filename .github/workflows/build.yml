name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      signed: ${{ steps.keystore.outputs.available }}

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # AGP 9 requires JDK 17+. 21 is the LTS this project builds against
      # locally (see .mise.toml).
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Handles dependency/build caching. Wrapper-jar checksum validation is
      # on by default, so it is not passed explicitly.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Android 17 is recent enough that the runner image does not ship it.
      #
      # The platform MUST be requested as "platforms;android-37.0" — API 37 uses
      # the minor-version naming scheme, and a plain "platforms;android-37" does
      # not exist and will fail to resolve. compileSdk = 37 still maps to it.
      #
      # This step also puts the SDK on ANDROID_HOME/ANDROID_SDK_ROOT, which is
      # how Gradle locates it here: local.properties is deliberately gitignored,
      # so there is no sdk.dir on CI.
      - name: Install Android SDK for API 37
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0'

      - name: Derive version
        id: version
        run: echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # Secrets are unavailable to pull requests from forks, so a missing
      # keystore is a warning rather than a failure: the release build stays
      # unsigned and the publish job is skipped.
      - name: Decode release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::warning::RELEASE_KEYSTORE_BASE64 is not set — the release APK will be unsigned and no GitHub release will be published.'
          else
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo 'available=true' >> "$GITHUB_OUTPUT"
          fi

      # When the signing variables are absent or incomplete, app/build.gradle.kts
      # falls back to an unsigned release build rather than failing.
      - name: Assemble and lint
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleDebug assembleRelease lintDebug \
            "-PappVersionCode=${{ github.run_number }}" \
            "-PappVersionName=${{ steps.version.outputs.version }}" \
            --stacktrace

      # A signed build produces app-release.apk; an unsigned one produces
      # app-release-unsigned.apk. Assert the signed name and give it a
      # human-friendly filename for the release page.
      - name: Stage signed APK
        if: ${{ steps.keystore.outputs.available == 'true' }}
        run: |
          set -euo pipefail
          src=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$src" ]; then
            echo "::error::expected a signed $src but it does not exist"
            ls -l app/build/outputs/apk/release/
            exit 1
          fi
          mkdir -p dist
          cp "$src" "dist/wakeup-${{ steps.version.outputs.version }}.apk"

      - name: Upload signed release APK
        if: ${{ steps.keystore.outputs.available == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: dist/*.apk
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Runs even when the build fails, since that is exactly when the lint
      # report is worth reading.
      - name: Upload lint report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: warn

  release:
    name: Publish GitHub release
    needs: build
    # Only for real pushes to main, and only when the APK was actually signed.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.build.outputs.signed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download signed APK
        uses: actions/download-artifact@v8
        with:
          name: app-release
          path: dist

      # gh is preinstalled on GitHub-hosted runners; GH_REPO means no checkout
      # is needed just to give it repository context.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(dist/*.apk)
          if [ ${#apks[@]} -ne 1 ]; then
            echo "::error::expected exactly one APK in dist/, found ${#apks[@]}"
            ls -l dist/ || true
            exit 1
          fi
          apk="${apks[0]}"
          # Defence in depth: never publish an APK nobody can install.
          case "$apk" in
            *unsigned*)
              echo "::error::refusing to publish an unsigned APK: $apk"
              exit 1
              ;;
          esac
          gh release create "v${VERSION}" "$apk" \
            --title "v${VERSION}" \
            --target "$GITHUB_SHA" \
            --generate-notes
